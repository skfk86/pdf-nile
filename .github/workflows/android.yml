name: PDF Nile build (play flavor)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build play release (APK)
        run: ./gradlew :app:assemblePlayRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx4g
      - name: Build play release (AAB)
        run: |
          set +e
          ./gradlew :app:bundlePlayRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx4g > aab.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "What went wrong|Execution failed|error:|e: |FAILURE|Caused by|Could not|No matching|not found" aab.log | head -15 | while IFS= read -r line; do echo "::error::${line:0:400}"; done
          fi
          exit $code
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-nile-play-apk
          path: app/build/outputs/apk/play/release/*.apk
          if-no-files-found: error
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: pdf-nile-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
