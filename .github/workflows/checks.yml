name: Full checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          set +e
          ./gradlew testPlayDebugUnitTest :pdf-core:testDebugUnitTest :ocr-core:testDebugUnitTest --continue --stacktrace -Dorg.gradle.jvmargs="-Xmx4g" -Pkotlin.daemon.jvmargs=-Xmx4g > tests.log 2>&1
          code=$?
          grep -E "tests completed|FAILED|BUILD (SUCCESSFUL|FAILED)|Execution failed" tests.log | head -20 | while IFS= read -r l; do echo "::notice::TEST ${l:0:300}"; done
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('**/build/test-results/**/*.xml',recursive=True):
              r=ET.parse(p).getroot(); t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          print(f"::notice::UNIT TESTS total={t} failures={f} errors={e} skipped={s}")
          PY
          exit 0
      - name: Lint (play release)
        run: |
          set +e
          ./gradlew :app:lintPlayRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g" -Pkotlin.daemon.jvmargs=-Xmx4g > lint.log 2>&1
          grep -E "Lint found|errors|warnings|BUILD (SUCCESSFUL|FAILED)" lint.log | head -10 | while IFS= read -r l; do echo "::notice::LINT ${l:0:300}"; done
          f=$(ls app/build/reports/lint-results-playRelease.xml 2>/dev/null)
          if [ -n "$f" ]; then
            python3 - "$f" <<'PY'
          import sys,xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot()
          n=0
          for i in r.findall('issue'):
              if i.get('severity') in ('Error','Fatal'):
                  loc=i.find('location'); n+=1
                  if n<=15: print(f"::error::LINT {i.get('id')}: {i.get('message')[:200]} @ {loc.get('file') if loc is not None else ''}")
          print(f"::notice::LINT error/fatal issues = {n}")
          PY
          fi
          exit 0
      - name: Inspect APK contents and manifest
        run: |
          set +e
          ./gradlew :app:assemblePlayRelease -Dorg.gradle.jvmargs="-Xmx4g" -Pkotlin.daemon.jvmargs=-Xmx4g > apk.log 2>&1
          apk=$(ls app/build/outputs/apk/play/release/*universal*.apk | head -1)
          echo "::notice::APK $apk $(stat -c%s "$apk") bytes"
          for pat in "assets/tessdata/ara.traineddata" "assets/tessdata/eng.traineddata" "assets/fonts/Tajawal-Regular.ttf" "lib/arm64-v8a/libtesseract" "libjpeg" ; do
            if unzip -l "$apk" | grep -q "$pat"; then echo "::notice::APK HAS $pat"; else echo "::error::APK MISSING $pat"; fi
          done
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          perms=$($BT/aapt2 dump permissions "$apk" 2>/dev/null | tr '\n' ' ')
          echo "::notice::PERMISSIONS $perms"
          $BT/aapt2 dump badging "$apk" 2>/dev/null | grep -E "^package:|application-label:|sdkVersion|targetSdkVersion" | while IFS= read -r l; do echo "::notice::BADGING ${l:0:200}"; done
          exit 0
